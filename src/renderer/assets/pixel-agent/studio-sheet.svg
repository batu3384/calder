<svg xmlns="http://www.w3.org/2000/svg" width="128" height="32" shape-rendering="crispEdges">
  <!-- Pixel Studio sprite sheet: 16×16 tiles
       Row 0: research | files | git | terminal | test_build | security | agent-idle | agent-bob
       Coordinates are tile index * 16.
  -->

  <!-- research (magnifier) @0 -->
  <g transform="translate(0,0)">
    <rect width="16" height="16" fill="#1a2332"/>
    <rect x="3" y="3" width="7" height="7" fill="#5b9bd5"/>
    <rect x="4" y="4" width="5" height="5" fill="#1a2332"/>
    <rect x="9" y="9" width="4" height="2" fill="#3a7ab8"/>
    <rect x="11" y="11" width="2" height="2" fill="#2f6aa3"/>
  </g>

  <!-- files (document) @16 -->
  <g transform="translate(16,0)">
    <rect width="16" height="16" fill="#1a2332"/>
    <rect x="4" y="2" width="8" height="12" fill="#c9a227"/>
    <rect x="5" y="3" width="6" height="2" fill="#e0b83a"/>
    <rect x="5" y="6" width="6" height="1" fill="#1a2332"/>
    <rect x="5" y="8" width="5" height="1" fill="#1a2332"/>
    <rect x="5" y="10" width="4" height="1" fill="#1a2332"/>
  </g>

  <!-- git (branch) @32 -->
  <g transform="translate(32,0)">
    <rect width="16" height="16" fill="#1a2332"/>
    <rect x="7" y="2" width="2" height="12" fill="#e67e22"/>
    <rect x="3" y="4" width="6" height="2" fill="#e67e22"/>
    <rect x="3" y="4" width="2" height="6" fill="#c96516"/>
    <rect x="9" y="8" width="4" height="2" fill="#e67e22"/>
    <rect x="11" y="8" width="2" height="5" fill="#c96516"/>
  </g>

  <!-- terminal (prompt) @48 -->
  <g transform="translate(48,0)">
    <rect width="16" height="16" fill="#1a2332"/>
    <rect x="2" y="3" width="12" height="10" fill="#0d3a4a"/>
    <rect x="3" y="5" width="2" height="2" fill="#66ccff"/>
    <rect x="5" y="6" width="2" height="2" fill="#66ccff"/>
    <rect x="7" y="7" width="2" height="2" fill="#66ccff"/>
    <rect x="10" y="10" width="3" height="1" fill="#4ab8d8"/>
  </g>

  <!-- test_build (beaker/gear) @64 -->
  <g transform="translate(64,0)">
    <rect width="16" height="16" fill="#1a2332"/>
    <rect x="6" y="2" width="4" height="3" fill="#3d9970"/>
    <rect x="4" y="5" width="8" height="2" fill="#3d9970"/>
    <rect x="3" y="7" width="10" height="6" fill="#2f7a59"/>
    <rect x="5" y="9" width="2" height="2" fill="#7dcea0"/>
    <rect x="9" y="10" width="2" height="2" fill="#7dcea0"/>
  </g>

  <!-- security (shield) @80 -->
  <g transform="translate(80,0)">
    <rect width="16" height="16" fill="#1a2332"/>
    <rect x="4" y="2" width="8" height="3" fill="#e5534b"/>
    <rect x="3" y="5" width="10" height="5" fill="#c9443d"/>
    <rect x="5" y="10" width="6" height="2" fill="#e5534b"/>
    <rect x="6" y="12" width="4" height="2" fill="#a8322c"/>
    <rect x="7" y="6" width="2" height="3" fill="#1a2332"/>
  </g>

  <!-- agent idle @96 -->
  <g transform="translate(96,0)">
    <rect width="16" height="16" fill="none"/>
    <rect x="5" y="3" width="6" height="5" fill="#4285f4"/>
    <rect x="6" y="4" width="1" height="1" fill="#fff"/>
    <rect x="9" y="4" width="1" height="1" fill="#fff"/>
    <rect x="6" y="8" width="4" height="4" fill="#3367d6"/>
    <rect x="5" y="12" width="2" height="2" fill="#2a56c6"/>
    <rect x="9" y="12" width="2" height="2" fill="#2a56c6"/>
  </g>

  <!-- agent bob (raised) @112 -->
  <g transform="translate(112,0)">
    <rect width="16" height="16" fill="none"/>
    <rect x="5" y="1" width="6" height="5" fill="#4285f4"/>
    <rect x="6" y="2" width="1" height="1" fill="#fff"/>
    <rect x="9" y="2" width="1" height="1" fill="#fff"/>
    <rect x="6" y="6" width="4" height="4" fill="#3367d6"/>
    <rect x="5" y="10" width="2" height="2" fill="#2a56c6"/>
    <rect x="9" y="10" width="2" height="2" fill="#2a56c6"/>
  </g>
</svg>
