<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https: wss: http://127.0.0.1:* http://localhost:* ws://127.0.0.1:* ws://localhost:*; frame-src 'self';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calder</title>
    <link rel="icon" type="image/png" href="icon.png" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="xterm.css" />
    <style>
      html:not([data-ui-ready]) #app {
        opacity: 0;
        pointer-events: none;
      }
      html[data-ui-ready] #app {
        opacity: 1;
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main-area">Skip to workspace</a>
    <div id="app">
      <nav id="sidebar" class="sidebar-surface project-rail command-dock" aria-label="Projects">
        <div id="sidebar-brand-row" class="sidebar-brand-row">
          <img
            class="sidebar-brand-mark"
            src="assets/brand/mark.svg"
            alt="Calder"
            width="16"
            height="16"
            decoding="async"
          />
          <div class="sidebar-brand-meta">
            <span class="sidebar-brand-name">Calder</span>
            <span class="sidebar-brand-status">Workspace</span>
          </div>
        </div>
        <div id="sidebar-header">
          <div class="sidebar-header-primary">
            <div class="sidebar-title-group">
              <div class="sidebar-brand-block">
                <span class="sidebar-title">Projects</span>
              </div>
            </div>
            <button
              id="btn-toggle-sidebar"
              class="icon-btn sidebar-toggle-btn"
              title="Toggle Sidebar (Cmd+B)"
              aria-label="Toggle sidebar"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="4" width="18" height="16" rx="3"></rect>
                <path d="M9 4v16"></path>
              </svg>
            </button>
            <div class="sidebar-header-actions">
              <button
                id="btn-preferences"
                class="icon-btn"
                title="Preferences"
                aria-label="Open preferences"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="12" cy="12" r="3.2"></circle>
                  <path
                    d="M19.4 15a1 1 0 0 0 .2 1.1l.1.1a2 2 0 0 1 0 2.8l-.2.2a2 2 0 0 1-2.8 0l-.1-.1a1 1 0 0 0-1.1-.2 1 1 0 0 0-.6.9V20a2 2 0 0 1-2 2h-.3a2 2 0 0 1-2-2v-.2a1 1 0 0 0-.7-.9 1 1 0 0 0-1 .2l-.2.1a2 2 0 0 1-2.8 0l-.2-.2a2 2 0 0 1 0-2.8l.1-.1a1 1 0 0 0 .2-1.1 1 1 0 0 0-.9-.6H4a2 2 0 0 1-2-2v-.3a2 2 0 0 1 2-2h.2a1 1 0 0 0 .9-.7 1 1 0 0 0-.2-1L4.8 8a2 2 0 0 1 0-2.8l.2-.2a2 2 0 0 1 2.8 0l.2.1a1 1 0 0 0 1 .2 1 1 0 0 0 .6-.9V4a2 2 0 0 1 2-2h.3a2 2 0 0 1 2 2v.2a1 1 0 0 0 .6.9 1 1 0 0 0 1.1-.2l.1-.1a2 2 0 0 1 2.8 0l.2.2a2 2 0 0 1 0 2.8l-.1.1a1 1 0 0 0-.2 1.1 1 1 0 0 0 .9.6H20a2 2 0 0 1 2 2v.3a2 2 0 0 1-2 2h-.2a1 1 0 0 0-.9.6z"
                  ></path>
                </svg>
              </button>
              <button
                id="btn-add-project"
                class="icon-btn"
                title="New Project (Ctrl+Shift+P)"
                aria-label="Create new project"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 5v14"></path>
                  <path d="M5 12h14"></path>
                </svg>
              </button>
            </div>
          </div>
        </div>
        <div id="sidebar-content">
          <div id="project-list" role="list" aria-label="Projects"></div>
        </div>
        <div id="sidebar-footer"></div>
      </nav>
      <div id="sidebar-resize-handle"></div>
      <main id="main-area" tabindex="-1" aria-label="Workspace">
        <div id="workspace-shell" class="workspace-shell-surface">
          <div id="workspace-stack" class="session-deck session-deck-surface">
            <div id="tab-bar" class="tab-bar-surface session-deck-surface">
              <div class="tab-bar-main">
                <button
                  type="button"
                  id="tab-scroll-prev"
                  class="tab-scroll-btn"
                  aria-label="Scroll tabs left"
                  title="Scroll tabs left"
                  hidden
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M15 6l-6 6 6 6"></path>
                  </svg>
                </button>
                <div id="tab-list" role="tablist" aria-label="Open sessions"></div>
                <button
                  type="button"
                  id="tab-scroll-next"
                  class="tab-scroll-btn"
                  aria-label="Scroll tabs right"
                  title="Scroll tabs right"
                  hidden
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M9 6l6 6-6 6"></path>
                  </svg>
                </button>
              </div>
              <div class="tab-bar-meta"></div>
              <div id="tab-actions">
                <div class="command-deck-status">
                  <button
                    type="button"
                    id="git-status"
                    aria-label="Git branch and working tree status"
                    title="Branch actions"
                  ></button>
                </div>
                <div id="session-launcher" class="session-launcher-group">
                  <div id="surface-mode-slot" hidden></div>
                  <div id="session-provider-slot" hidden></div>
                  <button
                    id="btn-update-cli-tools"
                    class="icon-btn"
                    title="Update CLI Tools"
                    aria-label="Update CLI tools"
                  >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <path d="M21 12a9 9 0 0 1-15.4 6.4"></path>
                      <path d="M3 12A9 9 0 0 1 18.4 5.6"></path>
                      <path d="M18 2v4h4"></path>
                      <path d="M6 22v-4H2"></path>
                    </svg>
                  </button>
                  <button
                    id="btn-add-session"
                    class="icon-btn"
                    title="New Session (Ctrl+Shift+N)"
                    aria-label="Create new session"
                  >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <path d="M12 5v14"></path>
                      <path d="M5 12h14"></path>
                    </svg>
                  </button>
                </div>
              </div>
            </div>
            <div id="terminal-container"></div>
            <div id="project-terminal-resize-handle" class="hidden"></div>
            <div id="project-terminal-panel" class="hidden">
              <div id="project-terminal-header">
                <span class="project-terminal-title">Quick Terminal</span>
                <button
                  id="btn-close-terminal"
                  class="icon-btn"
                  title="Close Terminal"
                  aria-label="Close terminal"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6 6l12 12"></path>
                    <path d="M18 6L6 18"></path>
                  </svg>
                </button>
              </div>
              <div id="project-terminal-container"></div>
            </div>
          </div>
          <aside
            id="context-inspector"
            class="context-inspector-open control-panel-surface ops-rail ops-rail-surface"
          >
            <div id="context-inspector-header">
              <div class="context-inspector-header-top">
                <div class="context-inspector-title-group">
                  <span class="context-inspector-title">Inspector</span>
                </div>
                <div class="context-inspector-header-actions">
                  <button
                    id="btn-close-context-inspector"
                    class="icon-btn"
                    title="Close Context Inspector"
                    aria-label="Close context inspector"
                  >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <path d="M6 6l12 12"></path>
                      <path d="M18 6L6 18"></path>
                    </svg>
                  </button>
                </div>
              </div>
              <div
                class="context-inspector-tabs"
                role="tablist"
                aria-label="Workspace inspector sections"
              >
                <button
                  id="context-inspector-tab-run"
                  class="context-inspector-tab active"
                  type="button"
                  role="tab"
                  aria-selected="true"
                  aria-controls="context-inspector-panel-run"
                  data-inspector-tab="capabilities"
                >
                  Run
                </button>
                <button
                  id="context-inspector-tab-project"
                  class="context-inspector-tab"
                  type="button"
                  role="tab"
                  aria-selected="false"
                  aria-controls="context-inspector-panel-project"
                  tabindex="-1"
                  data-inspector-tab="git"
                >
                  Project
                </button>
                <button
                  id="context-inspector-tab-timeline"
                  class="context-inspector-tab"
                  type="button"
                  role="tab"
                  aria-selected="false"
                  aria-controls="context-inspector-panel-timeline"
                  tabindex="-1"
                  data-inspector-tab="activity"
                >
                  Timeline
                </button>
              </div>
            </div>
            <div id="context-inspector-sections">
              <section
                id="context-inspector-panel-run"
                class="context-inspector-section active"
                role="tabpanel"
                aria-labelledby="context-inspector-tab-run"
                data-section="capabilities"
              >
                <div id="diagnostics-summary" class="diagnostics-summary" aria-live="polite"></div>
                <div id="config-sections" class="context-inspector-block-body"></div>
              </section>
              <section
                id="context-inspector-panel-project"
                class="context-inspector-section"
                role="tabpanel"
                aria-labelledby="context-inspector-tab-project"
                aria-hidden="true"
                hidden
                data-section="git"
              >
                <header class="context-inspector-block-header">
                  <span class="context-inspector-block-title">Git Workspace</span>
                </header>
                <div id="git-panel" class="context-inspector-block-body"></div>
              </section>
              <section
                id="context-inspector-panel-timeline"
                class="context-inspector-section"
                role="tabpanel"
                aria-labelledby="context-inspector-tab-timeline"
                aria-hidden="true"
                hidden
                data-section="activity"
              >
                <header class="context-inspector-block-header">
                  <span class="context-inspector-block-title">Run Activity</span>
                </header>
                <div id="session-history" class="context-inspector-block-body"></div>
              </section>
            </div>
          </aside>
          <button
            id="btn-open-context-inspector"
            class="context-inspector-reopen hidden"
            type="button"
            title="Open control panel"
            aria-label="Open context inspector"
          >
            Overview
          </button>
        </div>
      </main>
      <footer
        id="status-bar"
        class="status-bar"
        role="status"
        aria-live="off"
        aria-label="Workspace status"
      >
        <div class="status-bar-group">
          <button
            type="button"
            id="status-bar-git"
            class="status-bar-item"
            title="Branch actions"
            aria-label="Git branch and working tree status"
          ></button>
          <button
            type="button"
            id="status-bar-provider"
            class="status-bar-item"
            aria-label="Session provider"
          ></button>
          <span id="status-bar-session" class="status-bar-item status-bar-session"></span>
        </div>
      </footer>
    </div>

    <div id="modal-overlay" class="hidden">
      <div id="modal">
        <div id="modal-title"></div>
        <div id="modal-body"></div>
        <div id="modal-actions">
          <button id="modal-cancel" class="modal-btn">Cancel</button>
          <button id="modal-confirm" class="modal-btn primary">Create</button>
        </div>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
